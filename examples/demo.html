    s[i] = .12 + R() * .35; b[i] = .12 + R() * .28; const w = R(); c.set([.5 + w * .3, .55 + w * .1, .9 - w * .2], i * 3); }
  g.setAttribute("position", new THREE.BufferAttribute(p, 3)); g.setAttribute("sz", new THREE.BufferAttribute(s, 1));
  g.setAttribute("br", new THREE.BufferAttribute(b, 1)); g.setAttribute("col", new THREE.BufferAttribute(c, 3));
  const dust = new THREE.Points(g, new THREE.ShaderMaterial({ uniforms: ru, ...blend, vertexShader: rm.vertexShader,
    fragmentShader: `precision mediump float; varying vec3 vC; varying float vA; void main(){ float d=length(gl_PointCoord-.5); if(d>.5) discard; float a=pow(1.-2.*d,2.); gl_FragColor=vec4(vC*a*vA,1.); }` }));
  dust.frustumCulled = false; scene.add(dust); }

// ---------- camera control ----------
const cam = { th: 0.6, ph: 1.05, d: 105, tth: 0.6, tph: 1.05, td: 105 };
let tour = true, drag = false, lx = 0, ly = 0, mouse = null, hoverIdx = -1, downAt = [0, 0];
const focus = { cur: [0, 0, 0], tgt: [0, 0, 0] };
function setFocus(i) {   // i < 0 resets to the whole galaxy
  if (i >= 0) { focus.tgt = pos[i].slice(); cam.td = 22; if (tour) tourBtn.click(); }
  else { focus.tgt = [0, 0, 0]; cam.td = 105; }
}
canvas.addEventListener("pointerdown", e => { drag = true; lx = downAt[0] = e.clientX; ly = downAt[1] = e.clientY; canvas.classList.add("drag"); canvas.setPointerCapture(e.pointerId); });
addEventListener("pointerup", e => { drag = false; canvas.classList.remove("drag");
  if (Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) < 5 && e.target === canvas) setFocus(hoverIdx); });
addEventListener("keydown", e => { if (e.key === "Escape") setFocus(-1); });
addEventListener("pointermove", e => { mouse = [e.clientX, e.clientY];
  if (!drag) return; cam.tth -= (e.clientX - lx) * .006; cam.tph = Math.max(.15, Math.min(Math.PI - .15, cam.tph - (e.clientY - ly) * .006)); lx = e.clientX; ly = e.clientY; });
canvas.addEventListener("wheel", e => { e.preventDefault(); cam.td = Math.max(12, Math.min(320, cam.td * Math.exp(e.deltaY * .001))); }, { passive: false });

// ---------- timeline ----------
let now = 0, playing = true, speed = 1, clock = 0, last = performance.now();
const $ = id => document.getElementById(id);
const play = $("play"), scrub = $("scrub"), tourBtn = $("tour");
const setPlaying = p => { playing = p; play.innerHTML = p ? "&#10074;&#10074;" : "&#9654;"; };
play.onclick = () => { if (now >= span) now = 0; setPlaying(!playing); };
scrub.oninput = () => { now = scrub.value / 10000 * span; };
$("speed").onchange = e => { speed = +e.target.value; };
tourBtn.onclick = () => { tour = !tour; tourBtn.classList.toggle("on", tour); };
addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); play.click(); } if (e.key === "t") tourBtn.click(); });

$("sub").textContent = new Date(T0 * 1000).getFullYear() + " — " + new Date(commits[commits.length - 1][1] * 1000).getFullYear() + " · " + repos.length + " systems";
$("sCommits").textContent = "0";

// rhythm heatmap
const rc = $("rc").getContext("2d"), gridCount = new Float32Array(168);
let gridUpto = 0, gridMax = 1;
function drawRhythm(upto) {
  if (upto < gridUpto) { gridCount.fill(0); gridUpto = 0; gridMax = 1; }
  for (let i = gridUpto; i < upto; i++) { const v = ++gridCount[grid[i]]; if (v > gridMax) gridMax = v; }
  gridUpto = upto;
  rc.clearRect(0, 0, 240, 84);
  const cw = 10, ch = 12;
  for (let d = 0; d < 7; d++) for (let h = 0; h < 24; h++) {
    const t = Math.pow(gridCount[d * 24 + h] / gridMax, .55), [r, g, b] = hourColor(h);
    rc.fillStyle = t < .01 ? "rgba(143,180,255,.06)" : `rgba(${r * 255 | 0},${g * 255 | 0},${b * 255 | 0},${.18 + .82 * t})`;
    rc.fillRect(h * cw + 1, d * ch + 1, cw - 2, ch - 2);
  }
}

// ---------- tooltip ----------
const tip = $("tip"), v3 = new THREE.Vector3();
function hover(w, h, repoCounts) {
  hoverIdx = -1;
  if (!mouse || drag) { tip.style.display = "none"; return; }
  let best = -1, bd = 26 * 26;
  for (let i = 0; i < repos.length; i++) { if (!repoCounts[i]) continue;
    v3.set(pos[i][0], pos[i][1], pos[i][2]).project(camera); if (v3.z > 1) continue;
    const dx = (v3.x * .5 + .5) * w - mouse[0], dy = (-v3.y * .5 + .5) * h - mouse[1], d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = i; } }
  if (best < 0) { tip.style.display = "none"; return; }
  hoverIdx = best;
  tip.style.display = "block"; tip.style.left = mouse[0] + "px"; tip.style.top = mouse[1] + "px";
  tip.innerHTML = `<b>${repos[best].n.replace(/</g, "&lt;")}</b><br>${repoCounts[best]} / ${repos[best].k} commits`;
}

// ---------- main loop ----------
const repoCounts = new Array(repos.length).fill(0);
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  cu.uPx.value = h * renderer.getPixelRatio() * 0.5 / Math.tan(camera.fov * Math.PI / 360);
}
addEventListener("resize", resize); resize();

function frame(t) {
  const dt = Math.min(0.1, (t - last) / 1000); last = t; clock += dt;
  if (playing) { now += dt * speed * span / 75; if (now >= span) { now = span; setPlaying(false); } }
  scrub.value = now / span * 10000;
  cu.uTime.value = clock; cu.uNow.value = now;

  const upto = bsearch(births, now);
  $("sCommits").textContent = upto.toLocaleString();
  $("sLines").textContent = fmt(cumLines[upto]);
  let alive = 0;
  for (let i = 0; i < repos.length; i++) {
    const rb = repoBirths[i], n = bsearch(rb, now), recent = n - bsearch(rb, now - 3);
    repoCounts[i] = n; if (n) alive++;
    rSz[i] = n ? 2.2 + Math.log2(1 + n) * 1.0 : 0;
    rBr[i] = n ? Math.min(1.6, .55 + recent * .25) : 0;
  }
  rg.attributes.sz.needsUpdate = rg.attributes.br.needsUpdate = true;
  $("sRepos").textContent = alive;
  $("date").textContent = new Date(commits[Math.max(0, upto - 1)][1] * 1000).toISOString().slice(0, 10);
  drawRhythm(upto);

  if (tour && !drag) { cam.tth += dt * .07; cam.tph = 1.0 + Math.sin(clock * .05) * .22; cam.td = cam.td + (105 + Math.sin(clock * .08) * 30 - cam.td) * dt * .3; cam.th = cam.tth; }
  cam.th += (cam.tth - cam.th) * .08; cam.ph += (cam.tph - cam.ph) * .08; cam.d += (cam.td - cam.d) * .08;
  for (let k = 0; k < 3; k++) focus.cur[k] += (focus.tgt[k] - focus.cur[k]) * .07;
  camera.position.set(focus.cur[0] + cam.d * Math.sin(cam.ph) * Math.cos(cam.th), focus.cur[1] + cam.d * Math.cos(cam.ph), focus.cur[2] + cam.d * Math.sin(cam.ph) * Math.sin(cam.th));
  camera.lookAt(focus.cur[0], focus.cur[1], focus.cur[2]); camera.updateMatrixWorld();
  commitPts.rotation.y = repoPts.rotation.y = 0;
  renderer.render(scene, camera);
  hover(innerWidth, innerHeight, repoCounts);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
